<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vibemon Groene Editie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: one handheld console, centered; the LCD is the hero, controls below it. Single deliberate look. */
:root {
  --room: #2c3a31;
  --room-text: #cfdcc6;
  --shell: #cbc7bf;
  --shell-shade: #a9a49b;
  --bezel: #5f5e6b;
  --bezel-text: #c9cad6;
  --lcd: #e0f8d0;
  --ink: #2c2a63;
  --btn: #9a1f4b;
  --btn-shade: #6e1435;
  --dpad: #26262b;
  --led: #e2333f;
  --pixel: 'Press Start 2P', 'Courier New', monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--room);
  color: var(--room-text);
  font-family: var(--pixel);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
  -webkit-user-select: none;
  user-select: none;
}
.gb {
  width: min(380px, 100%);
  background: var(--shell);
  border-radius: 12px 12px 60px 12px;
  padding: 18px 18px 26px;
  box-sizing: border-box;
  box-shadow: inset -5px -7px 0 var(--shell-shade), 0 24px 48px rgba(0,0,0,.4);
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.bezel {
  background: var(--bezel);
  border-radius: 8px 8px 36px 8px;
  padding: 10px 22px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.bezel-top {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 6px;
  letter-spacing: .08em;
  color: var(--bezel-text);
}
.bezel-top::before, .bezel-top::after { content: ""; flex: 1; height: 2px; background: var(--btn); box-shadow: 0 4px 0 var(--ink); }
.screen-row { display: flex; align-items: center; gap: 10px; }
.led { width: 7px; height: 7px; border-radius: 50%; background: #3a1418; flex: none; }
.led.on { background: var(--led); box-shadow: 0 0 6px var(--led); }
canvas {
  display: block;
  width: 100%;
  min-width: 0;
  aspect-ratio: 160 / 144;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  background: var(--lcd);
}
.brand { font-size: 13px; color: var(--ink); font-style: italic; letter-spacing: .02em; }
.brand small { font-size: 8px; font-style: normal; margin-left: 4px; }
.controls { display: flex; justify-content: space-between; align-items: center; padding-top: 4px; }
.dpad { display: grid; grid-template-columns: repeat(3, 38px); grid-template-rows: repeat(3, 38px); }
.dpad button { background: var(--dpad); border: 0; padding: 0; touch-action: none; cursor: pointer; }
.dpad .u { grid-area: 1 / 2; border-radius: 4px 4px 0 0; }
.dpad .l { grid-area: 2 / 1; border-radius: 4px 0 0 4px; }
.dpad .c { grid-area: 2 / 2; background: var(--dpad); pointer-events: none; }
.dpad .r { grid-area: 2 / 3; border-radius: 0 4px 4px 0; }
.dpad .d { grid-area: 3 / 2; border-radius: 0 0 4px 4px; }
.ab { display: flex; gap: 14px; transform: rotate(-25deg); }
.ab div { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 9px; color: var(--ink); }
.ab button {
  width: 50px; height: 50px; border-radius: 50%; border: 0;
  background: var(--btn); box-shadow: inset -3px -4px 0 var(--btn-shade);
  touch-action: none; cursor: pointer;
}
.ab .a { margin-top: -26px; }
.ss { display: flex; justify-content: center; gap: 22px; }
.ss div { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 7px; color: var(--ink); letter-spacing: .06em; }
.ss button { width: 46px; height: 12px; border-radius: 6px; border: 0; background: var(--bezel); transform: rotate(-25deg); touch-action: none; cursor: pointer; }
button:active, button.down { filter: brightness(1.35); }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.help { max-width: 380px; font-size: 8px; line-height: 2; text-align: center; margin: 0; color: var(--room-text); opacity: .85; }
.help b { color: #fff; font-weight: normal; }
</style>
</head>

<script>
'use strict';
/* =========================================================
   VIBEMON - GROENE EDITIE
   Een klein Game Boy-achtig monsterspel. Alles wordt in code
   getekend; er worden geen afbeeldingen geladen.
   ========================================================= */

const PAL = ['#e0f8d0', '#88c070', '#346856', '#081820'];
const RGB = PAL.map(h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)));
const cv = document.getElementById('screen');
const ctx = cv.getContext('2d');
const SC = cv.width / 160;
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const OPP = { up: 'down', down: 'up', left: 'right', right: 'left' };
const rnd = Math.random;

/* ---------- pixel art helpers ---------- */
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function helpers(g) {
  return {
    g,
    R(x, y, w, h, i) { g.fillStyle = PAL[i]; g.fillRect(x, y, w, h); },
    E(x, y, rx, ry, i) { g.fillStyle = PAL[i]; g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.fill(); },
    P(p, i) { g.fillStyle = PAL[i]; g.beginPath(); g.moveTo(p[0], p[1]); for (let k = 2; k < p.length; k += 2) g.lineTo(p[k], p[k + 1]); g.closePath(); g.fill(); },
    clipE(x, y, rx, ry, fn) { g.save(); g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.clip(); fn(); g.restore(); },
    top(x, y, r, i) { g.fillStyle = PAL[i]; g.beginPath(); g.arc(x, y, r, Math.PI, 0); g.closePath(); g.fill(); }
  };
}
// snap every pixel to the 4-colour palette and add a dark outline
function crisp(c, outline) {
  const g = c.getContext('2d'), w = c.width, h = c.height, img = g.getImageData(0, 0, w, h), d = img.data;
  const ix = new Int8Array(w * h);
  for (let p = 0; p < w * h; p++) {
    if (d[p * 4 + 3] < 120) { ix[p] = -1; continue; }
    let best = 0, bd = 1e9;
    for (let k = 0; k < 4; k++) {
      const dr = d[p * 4] - RGB[k][0], dg = d[p * 4 + 1] - RGB[k][1], db = d[p * 4 + 2] - RGB[k][2];
      const dd = dr * dr + dg * dg + db * db;
      if (dd < bd) { bd = dd; best = k; }
    }
    ix[p] = best;
  }
  if (outline) {
    const o = ix.slice();
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const p = y * w + x;
      if (ix[p] !== -1) continue;
      if ((x > 0 && ix[p - 1] >= 0) || (x < w - 1 && ix[p + 1] >= 0) || (y > 0 && ix[p - w] >= 0) || (y < h - 1 && ix[p + w] >= 0)) o[p] = 3;
    }
    ix.set(o);
  }
  for (let p = 0; p < w * h; p++) {
    const k = ix[p];
    if (k < 0) d[p * 4 + 3] = 0;
    else { d[p * 4] = RGB[k][0]; d[p * 4 + 1] = RGB[k][1]; d[p * 4 + 2] = RGB[k][2]; d[p * 4 + 3] = 255; }
  }
  g.putImageData(img, 0, 0);
  return c;
}
function art(w, h, fn, outline = true) { const c = canvas(w, h); fn(helpers(c.getContext('2d'))); return crisp(c, outline); }
function flip(c) { const n = canvas(c.width, c.height), g = n.getContext('2d'); g.scale(-1, 1); g.drawImage(c, -c.width, 0); return n; }

/* ---------- types, moves, species ---------- */
const EFF = {
  VUUR: { PLANT: 2, WATER: .5, STEEN: .5, VUUR: .5 },
  WATER: { VUUR: 2, STEEN: 2, PLANT: .5, WATER: .5 },
  PLANT: { WATER: 2, STEEN: 2, VUUR: .5, PLANT: .5, VLIEG: .5 },
  ELEKTRO: { WATER: 2, VLIEG: 2, PLANT: .5, ELEKTRO: .5, STEEN: .5 },
  STEEN: { VUUR: 2, VLIEG: 2 },
  VLIEG: { PLANT: 2, STEEN: .5, ELEKTRO: .5 },
  NORMAAL: { STEEN: .5 }
};
const eff = (a, d) => (EFF[a] && EFF[a][d]) || 1;

const MOVES = {
  kras: { name: 'KRAS', type: 'NORMAAL', pow: 40, acc: 100, pp: 35 },
  beuk: { name: 'BEUK', type: 'NORMAAL', pow: 40, acc: 100, pp: 35 },
  hap: { name: 'HAP', type: 'NORMAAL', pow: 60, acc: 100, pp: 25 },
  snel: { name: 'SNELAANVAL', type: 'NORMAAL', pow: 40, acc: 100, pp: 30, prio: 1 },
  grom: { name: 'GROM', type: 'NORMAAL', acc: 100, pp: 40, fx: ['foe', 'atk', -1] },
  staart: { name: 'STAARTZWAAI', type: 'NORMAAL', acc: 100, pp: 30, fx: ['foe', 'def', -1] },
  draad: { name: 'DRAADSPUUG', type: 'PLANT', acc: 95, pp: 40, fx: ['foe', 'spd', -1] },
  harden: { name: 'VERHARDEN', type: 'NORMAAL', acc: 100, pp: 30, fx: ['self', 'def', 1] },
  vonk: { name: 'VONK', type: 'VUUR', pow: 40, acc: 100, pp: 25 },
  vlambeet: { name: 'VLAMBEET', type: 'VUUR', pow: 65, acc: 95, pp: 15 },
  bel: { name: 'BELLETJE', type: 'WATER', pow: 40, acc: 100, pp: 30 },
  straal: { name: 'WATERSTRAAL', type: 'WATER', pow: 65, acc: 95, pp: 15 },
  blad: { name: 'BLADMES', type: 'PLANT', pow: 45, acc: 100, pp: 25 },
  zaad: { name: 'ZAADBOM', type: 'PLANT', pow: 65, acc: 95, pp: 15 },
  pik: { name: 'PIK', type: 'VLIEG', pow: 35, acc: 100, pp: 35 },
  wind: { name: 'WINDVLAAG', type: 'VLIEG', pow: 45, acc: 100, pp: 30 },
  zap: { name: 'ZAP', type: 'ELEKTRO', pow: 40, acc: 100, pp: 30 },
  worp: { name: 'STEENWORP', type: 'STEEN', pow: 50, acc: 90, pp: 15 }
};

const SPECIES = {
  vonkvos: { name: 'VONKVOS', type: 'VUUR', b: [39, 52, 43, 65], rate: 45, xp: 62,
    learn: [[1, 'kras'], [1, 'grom'], [6, 'vonk'], [12, 'vlambeet'], [16, 'hap']],
    draw(s, b) {
      s.P([30, 31, 33, 19, 31, 8, 38, 15, 38, 27, 34, 34], 1); s.P([32, 28, 34, 21, 36, 25, 35, 30], 0);
      s.E(19, 29, 10, 7, 1); if (!b) s.E(19, 31, 6, 4, 0);
      s.R(11, 32, 4, 6, 2); s.R(23, 32, 4, 6, 2);
      s.P([8, 14, 9, 2, 15, 10], 2); s.P([24, 10, 29, 2, 30, 14], 2);
      s.E(19, 17, 10, 8, 1);
      if (!b) { s.E(19, 21, 5, 3, 0); s.R(14, 15, 2, 3, 3); s.R(23, 15, 2, 3, 3); s.R(18, 19, 3, 2, 3); s.R(13, 13, 3, 1, 2); s.R(22, 13, 3, 1, 2); }
      else s.R(15, 12, 9, 2, 2);
    } },
  druppelpad: { name: 'DRUPPELPAD', type: 'WATER', b: [44, 48, 65, 43], rate: 45, xp: 63,
    learn: [[1, 'beuk'], [1, 'staart'], [6, 'bel'], [12, 'straal'], [16, 'hap']],
    draw(s, b) {
      s.E(20, 28, 15, 10, 1); if (!b) s.E(20, 31, 9, 6, 0);
      s.E(11, 16, 6, 6, 1); s.E(29, 16, 6, 6, 1);
      s.P([20, 3, 15, 13, 25, 13], 2); s.E(20, 13, 5, 4, 2); s.R(18, 10, 1, 2, 0);
      if (!b) { s.E(11, 16, 3, 3, 0); s.E(29, 16, 3, 3, 0); s.R(10, 15, 2, 3, 3); s.R(28, 15, 2, 3, 3); s.R(13, 24, 14, 1, 3); s.R(12, 23, 1, 1, 3); s.R(27, 23, 1, 1, 3); }
      else { s.R(14, 22, 3, 2, 2); s.R(24, 25, 3, 2, 2); }
      s.E(8, 37, 6, 2, 2); s.E(32, 37, 6, 2, 2);
    } },
  kiemkop: { name: 'KIEMKOP', type: 'PLANT', b: [45, 49, 49, 45], rate: 45, xp: 64,
    learn: [[1, 'beuk'], [1, 'grom'], [6, 'blad'], [12, 'zaad'], [16, 'harden']],
    draw(s, b) {
      s.E(20, 33, 9, 5, 1); s.E(13, 38, 4, 2, 2); s.E(27, 38, 4, 2, 2);
      s.E(20, 21, 12, 10, 1);
      s.R(19, 4, 2, 8, 2); s.E(14, 6, 6, 3, 2); s.E(26, 6, 6, 3, 2); s.E(14, 6, 3, 1, 1); s.E(26, 6, 3, 1, 1);
      if (!b) { s.E(15, 20, 2, 3, 3); s.E(25, 20, 2, 3, 3); s.R(15, 19, 1, 1, 0); s.R(25, 19, 1, 1, 0); s.R(11, 25, 3, 1, 2); s.R(26, 25, 3, 1, 2); s.R(18, 26, 4, 1, 3); }
      else { s.R(13, 18, 3, 3, 2); s.R(24, 22, 3, 3, 2); s.R(18, 26, 3, 3, 2); }
    } },
  piepmuis: { name: 'PIEPMUIS', type: 'NORMAAL', b: [30, 56, 35, 72], rate: 255, xp: 51,
    learn: [[1, 'beuk'], [1, 'staart'], [6, 'snel'], [12, 'hap']],
    draw(s, b) {
      s.R(30, 30, 7, 2, 2); s.R(35, 22, 2, 10, 2); s.R(33, 21, 3, 2, 2);
      s.E(20, 29, 10, 8, 1); if (!b) s.E(20, 31, 6, 5, 0);
      s.R(13, 35, 4, 4, 2); s.R(23, 35, 4, 4, 2);
      s.E(10, 9, 6, 6, 1); s.E(30, 9, 6, 6, 1); s.E(10, 9, 3, 3, 0); s.E(30, 9, 3, 3, 0);
      s.E(20, 18, 10, 8, 1);
      if (!b) { s.R(15, 16, 2, 3, 3); s.R(23, 16, 2, 3, 3); s.R(19, 20, 2, 2, 3); s.R(19, 23, 2, 2, 0); s.R(7, 21, 6, 1, 2); s.R(27, 21, 6, 1, 2); s.R(8, 19, 5, 1, 2); s.R(27, 19, 5, 1, 2); }
    } },
  tsjilp: { name: 'TSJILP', type: 'VLIEG', b: [40, 45, 40, 56], rate: 255, xp: 50,
    learn: [[1, 'pik'], [1, 'grom'], [8, 'wind'], [13, 'snel']],
    draw(s, b) {
      s.P([28, 24, 39, 16, 38, 32], 2);
      s.P([15, 10, 19, 1, 23, 11], 2);
      s.E(20, 24, 12, 11, 1);
      if (!b) { s.E(21, 28, 7, 6, 0); s.P([5, 21, 11, 18, 11, 25], 2); s.E(14, 19, 2, 2, 3); s.R(13, 18, 1, 1, 0); }
      s.E(26, 25, 5, 7, 2);
      s.R(17, 34, 2, 5, 3); s.R(23, 34, 2, 5, 3);
    } },
  rupsje: { name: 'RUPSJE', type: 'PLANT', b: [45, 30, 35, 45], rate: 255, xp: 39,
    learn: [[1, 'beuk'], [1, 'draad'], [7, 'blad']],
    draw(s, b) {
      s.E(7, 32, 5, 5, 1); s.E(14, 30, 6, 6, 1); s.E(21, 27, 6, 7, 1);
      s.R(6, 36, 2, 3, 2); s.R(13, 35, 2, 3, 2); s.R(20, 33, 2, 4, 2);
      s.R(28, 6, 1, 7, 3); s.R(34, 6, 1, 7, 3); s.E(28, 6, 1.6, 1.6, 3); s.E(34, 6, 1.6, 1.6, 3);
      s.E(31, 19, 8, 8, 1);
      s.R(13, 28, 3, 2, 2); s.R(20, 24, 3, 2, 2); s.R(6, 30, 2, 2, 2);
      if (!b) { s.E(31, 23, 4, 2.5, 0); s.E(28, 18, 2, 2, 3); s.E(34, 18, 2, 2, 3); s.R(29, 23, 4, 1, 3); }
    } },
  zoemzap: { name: 'ZOEMZAP', type: 'ELEKTRO', b: [35, 55, 30, 90], rate: 120, xp: 80,
    learn: [[1, 'zap'], [1, 'grom'], [9, 'snel'], [14, 'hap']],
    draw(s, b) {
      s.E(18, 11, 6, 8, 0); s.E(28, 11, 6, 8, 0);
      s.P([32, 22, 39, 24, 32, 27], 3);
      s.E(22, 25, 11, 8, 1); s.clipE(22, 25, 11, 8, () => { s.R(19, 15, 3, 20, 3); s.R(26, 15, 3, 20, 3); });
      s.R(7, 12, 1, 6, 3); s.R(12, 12, 1, 6, 3); s.R(5, 11, 3, 1, 3); s.R(12, 11, 3, 1, 3);
      s.E(10, 24, 7, 7, 1);
      if (!b) { s.E(8, 23, 2, 2, 3); s.E(13, 23, 2, 2, 3); s.R(8, 22, 1, 1, 0); s.R(13, 22, 1, 1, 0); s.R(9, 27, 4, 1, 3); }
      s.R(16, 32, 2, 4, 3); s.R(25, 32, 2, 4, 3);
    } },
  keisteen: { name: 'KEISTEEN', type: 'STEEN', b: [40, 80, 100, 20], rate: 180, xp: 73,
    learn: [[1, 'beuk'], [1, 'harden'], [7, 'worp']],
    draw(s, b) {
      s.E(5, 26, 5, 4, 2); s.E(35, 26, 5, 4, 2);
      s.P([7, 30, 9, 16, 16, 8, 27, 9, 33, 17, 34, 30, 26, 37, 14, 37], 2);
      s.P([11, 18, 17, 11, 24, 12, 18, 17], 1);
      s.R(22, 26, 6, 1, 3); s.R(27, 27, 1, 4, 3); s.R(12, 31, 4, 1, 3);
      if (!b) { s.R(13, 21, 4, 2, 3); s.R(23, 21, 4, 2, 3); s.R(12, 19, 5, 1, 3); s.R(23, 19, 5, 1, 3); s.R(16, 28, 8, 1, 3); }
    } },
  rotsreus: { name: 'ROTSREUS', type: 'STEEN', b: [70, 95, 115, 30], rate: 45, xp: 130,
    learn: [[1, 'beuk'], [1, 'harden'], [1, 'worp'], [1, 'hap']],
    draw(s, b) {
      s.E(5, 22, 6, 9, 2); s.E(35, 22, 6, 9, 2);
      s.P([6, 36, 8, 14, 14, 5, 26, 5, 32, 14, 34, 36], 2);
      s.P([12, 13, 16, 8, 24, 8, 20, 13], 1);
      s.E(5, 33, 5, 4, 1); s.E(35, 33, 5, 4, 1);
      s.R(12, 36, 6, 3, 3); s.R(22, 36, 6, 3, 3);
      s.R(10, 26, 7, 1, 3); s.R(25, 30, 6, 1, 3); s.R(30, 30, 1, 4, 3);
      if (!b) { s.R(14, 15, 4, 3, 3); s.R(22, 15, 4, 3, 3); s.R(15, 15, 1, 1, 0); s.R(23, 15, 1, 1, 0); s.R(16, 21, 8, 2, 3); s.R(17, 21, 1, 1, 0); s.R(22, 21, 1, 1, 0); }
    } }
};
const SPR = {};
for (const k in SPECIES) SPR[k] = { front: art(40, 40, s => SPECIES[k].draw(s, false)), back: flip(art(40, 40, s => SPECIES[k].draw(s, true))) };

/* ---------- people ---------- */
const LOOKS = {
  hero: { hair: 3, shirt: 2, hat: 1, hatC: 2 }, rival: { hair: 2, shirt: 1 }, prof: { hair: 1, shirt: 0 },
  mom: { hair: 2, shirt: 1, dress: 1 }, sis: { hair: 3, shirt: 1, dress: 1 }, boy: { hair: 3, shirt: 1, hat: 1, hatC: 1 },
  girl: { hair: 2, shirt: 2, dress: 1 }, old: { hair: 1, shirt: 2 }, nurse: { hair: 2, shirt: 0, hat: 1, hatC: 0, dress: 1 },
  clerk: { hair: 3, shirt: 2 }, leader: { hair: 3, shirt: 2, legs: 2 }, hiker: { hair: 3, shirt: 1, hat: 1, hatC: 3 }
};
function drawPerson(s, dir, f, L) {
  const leg = L.legs ?? 3;

function wrap(str) {

}
function say(str, o = {}) {

function pickEnemyMove(m) {
  const ids = m.moves.map(x => x.id);
  if (!B.wild && rnd() < 0.5) {
    const tgt = SPECIES[G.party[B.mi].sp].type;
    let best = ids[0], bv = -1;
    for (const id of ids) { const M = MOVES[id], v = M.pow ? M.pow * eff(M.type, tgt) : 15; if (v > bv) { bv = v; best = id; } }
    return best;
  }

}
const spdOf = (m, st) => stats(m).spd * mul(st.spd);
async function doTurn(act) {

    const ref = act.k >= 0 ? G.party[B.mi].moves[act.k] : null, pid = ref ? ref.id : 'beuk';
    const pp = MOVES[pid].prio || 0, ep = MOVES[eMove].prio || 0;
    const ps = spdOf(G.party[B.mi], B.stP), es = spdOf(B.ep[B.ei], B.stE);
    const pFirst = pp !== ep ? pp > ep : ps !== es ? ps > es : rnd() < 0.5;
    for (const side of pFirst ? ['p', 'e'] : ['e', 'p']) {

  if (act.t === 'run') {

    const ps = spdOf(G.party[B.mi], B.stP), es = spdOf(B.ep[0], B.stE);

async function blink(who) { for (let i = 0; i < 3; i++) { B['blink' + who] = true; await wait(70); B['blink' + who] = false; await wait(70); } }
async function attack(side, id, ref) {

  const sA = side === 'p' ? B.stP : B.stE, sD = side === 'p' ? B.stE : B.stP;
  const aName = side === 'p' ? nm(A) : enemyName(A), dName = side === 'p' ? enemyName(D) : nm(D);
  const M = MOVES[id];
  if (ref) ref.pp--;
  await say(aName + ' gebruikt ' + M.name + '!');
  if (rnd() * 100 >= M.acc) { await say('Maar het mist!'); return; }
  if (M.fx) {
    const [who, stat, dv] = M.fx, tgt = who === 'self' ? sA : sD, tn = who === 'self' ? aName : dName;
    if ((dv < 0 && tgt[stat] <= -6) || (dv > 0 && tgt[stat] >= 6)) { await say('Er gebeurt niets!'); return; }
    tgt[stat] += dv; sfx(dv < 0 ? 'down' : 'up');

    return;
  }
  const e = eff(M.type, SPECIES[D.sp].type), crit = rnd() < 1 / 16;

  await blink(side === 'p' ? 'E' : 'P');
  D.hp = Math.max(0, D.hp - dmg);
  await tween(B, side === 'p' ? 'hpE' : 'hpP', D.hp, 250 + Math.min(600, dmg * 25));
  if (crit) await say('Een voltreffer!');
  if (e > 1) await say('Het is super effectief!');

}

  const caught = rnd() < p, shakes = caught ? 3 : Math.min(2, Math.floor(rnd() * 3 * (0.4 + p)));
  for (let i = 0; i < shakes; i++) {
    sfx('shake'); await tween(B.ball, 'shake', 1, 120); await tween(B.ball, 'shake', -1, 160); await tween(B.ball, 'shake', 0, 100); await wait(350);
  }
  if (caught) {
    sfx('caught'); G.caught++;
    await say('Gelukt! ' + nm(en) + ' is gevangen!');
    if (G.party.length < 6) G.party.push(en);
    else { G.box.push(en); await say(nm(en) + ' is naar de opslag gestuurd.'); }
    return true;
  }
  B.ball = null; B.eShow = true;
  await say(['Oh nee! Het monster brak los!', 'Ahh! Bijna gevangen!', 'Verdorie! Het scheelde zo weinig!'][shakes]);
  return false;
}
function drawBattle() {
  R(0, 0, 160, 144, 0);
  ctx.drawImage(PLATFORM, 102, 36); ctx.drawImage(PLATFORM, 6, 84);
  const en = B.ep[B.ei], me = G.party[B.mi];
  if (B.trShow) big(PEOPLE[B.tr.look].down[0], 116 + Math.round(B.eX), 4, 2);
  else if (B.eShow && !B.blinkE) { ctx.save(); ctx.beginPath(); ctx.rect(100, 0, 60, 46); ctx.clip(); ctx.drawImage(SPR[en.sp].front, 112 + Math.round(B.eX), 4 + Math.round(B.eY)); ctx.restore(); }
  if (B.heroShow) big(PEOPLE.hero.up[0], 20 + Math.round(B.pX), 60, 2);
  else if (B.pShow && !B.blinkP && me) { ctx.save(); ctx.beginPath(); ctx.rect(0, 40, 80, 54); ctx.clip(); ctx.drawImage(SPR[me.sp].back, 16 + Math.round(B.pX), 52 + Math.round(B.pY)); ctx.restore(); }
  if (B.ball) {
    const t = B.ball.t, bx = 40 + 88 * t + B.ball.shake * 2, by = 78 - 46 * t - Math.sin(Math.PI * t) * 30;
    ctx.drawImage(BALL8, Math.round(bx), Math.round(by));
  }
  if (!B.trShow && (B.eShow || B.ball)) {
    text(nm(en), 8, 4); text('Lv' + en.lv, 40, 14);
    text('HP', 8, 23, 2); hpbar(26, 24, 50, B.hpE / stats(en).hp);
    R(6, 32, 76, 1, 3); R(81, 22, 1, 11, 3);
  }
  if (B.pShow && me) {
    const s = stats(me);
    text(nm(me), 72, 56); text('Lv' + me.lv, 112, 66);
    text('HP', 72, 75, 2); hpbar(90, 76, 56, B.hpP / s.hp);
    text((Math.ceil(B.hpP) + '/' + s.hp).padStart(7), 88, 85);
    R(155, 66, 1, 28, 3); R(70, 93, 86, 1, 3);
  }
  box(0, 96, 160, 48);
}

/* ---------- title / intro / ending ---------- */
const TITLE_MONS = ['vonkvos', 'druppelpad', 'kiemkop', 'zoemzap', 'tsjilp', 'keisteen', 'piepmuis', 'rotsreus', 'rupsje'];
function drawTitle() {
  R(0, 0, 160, 144, 0);
  text('VIBEMON', 25, 13, 1, 16); text('VIBEMON', 24, 12, 3, 16);
  R(16, 32, 128, 2, 3);
  text('GROENE EDITIE', 28, 40, 2);
  const i = Math.floor(T / 2.4) % TITLE_MONS.length, t = (T / 2.4) % 1;
  const x = 60 + (t < 0.12 ? (0.12 - t) * 500 : t > 0.9 ? (0.9 - t) * 600 : 0);
  ctx.drawImage(PLATFORM, 50, 86);
  ctx.drawImage(SPR[TITLE_MONS[i]].front, Math.round(x), 54);
  if (!UI.menu && Math.floor(T * 2) % 2) text('DRUK OP START', 28, 112);
  text('VIBE CODED 2026', 20, 132, 1);
}
function drawIntro() { R(0, 0, 160, 144, 0); ctx.drawImage(PLATFORM, 50, 74); big(PEOPLE.prof.down[0], 56, 30, 3); }
function drawEnding() {
  R(0, 0, 160, 144, 0);
  text('KEIBADGE', 48, 8, 3);
  const s = SPR[G.party[0] ? G.party[0].sp : 'vonkvos'].front;
  ctx.drawImage(PLATFORM, 50, 74);
  ctx.drawImage(s, 60, 38 + Math.round(Math.abs(Math.sin(T * 4)) * -6));
  for (let k = 0; k < 6; k++) { const a = T * 1.5 + k; R(Math.round(80 + Math.cos(a) * 60), Math.round(52 + Math.sin(a * 1.3) * 34), 2, 2, k % 2 ? 1 : 2); }
}
async function titleScreen() {
  G.scene = 'title'; music('title');
  await waitKey(['a', 'start']);
  sfx('sel');
  const sv = loadSave();
  if (sv) {
    const i = await choose(['NIEUW SPEL', 'DOORGAAN'], { x: 16, y: 96, w: 128, cancel: false, start: 1 });
    if (i === 1) {
      await fade(1);
      Object.assign(G, sv, { scene: 'world', busy: true, mv: null });
      resetEnts(); enterMap(G.map, G.x, G.y, G.dir);
      await fade(0);
      return;
    }
  }
  await fade(1);
  const muted = G.muted; G = freshState(); G.muted = muted; G.busy = true; G.fade = 1; G.scene = 'intro';
  resetEnts(); music('center');
  await fade(0);
  await say('Hallo daar! Welkom in de wereld van VIBEMON!');
  await say('Ik ben PROF. LINDE. Iedereen hier noemt mij de MONSTER-PROF.');
  await say('Deze wereld zit vol met wezens die VIBEMON heten.');
  await say('Sommige mensen houden ze als huisdier. Anderen laten ze vechten in spannende gevechten.');
  await say('En jij? Jouw avontuur begint vandaag! Kom straks naar mijn LAB in DENNENDORP.');
  await fade(1);
  G.scene = 'world'; enterMap('house', 3, 5, 'down');
  await fade(0);
}

/* ---------- save ---------- */
const SAVE_KEY = 'vibemon-groen-v1';
function save() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({ map: G.map, x: G.x, y: G.y, dir: G.dir, party: G.party, box: G.box, items: G.items, money: G.money, flags: G.flags, heal: G.heal, caught: G.caught }));
    return true;
  } catch (e) { return false; }
}
function loadSave() { try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }

/* ---------- main loop ---------- */
function update(dt) {
  updTimers(dt);
  if (G.bumpT > 0) G.bumpT -= dt;
  if (G.loc && G.loc.t > 0) G.loc.t -= dt;
  if (G.scene === 'world') { updMove(dt); updEnts(dt); }
  if (UI.menu) updMenu();
  else if (UI.text) updText(dt);
  else if (UI.wait) { if (UI.wait.ks.some(k => hit(k))) { const r = UI.wait.r; UI.wait = null; r(); } }
  else if (G.scene === 'world' && !G.busy && !G.mv) worldInput(dt);
}
function render() {
  ctx.setTransform(SC, 0, 0, SC, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.textBaseline = 'top';
  if (G.scene === 'title') drawTitle();
  else if (G.scene === 'intro') drawIntro();
  else if (G.scene === 'ending') drawEnding();
  else if (G.scene === 'battle' && B) drawBattle();
  else drawWorld();
  if (UI.pic) { box(24, 8, 56, 56); ctx.drawImage(SPR[UI.pic].front, 32, 16); }
  if (UI.under) UI.under();
  drawTextBox();
  if (UI.menu) drawMenu(UI.menu);
  if (G.wipe > 0) for (let i = 0; i < 9; i++) { const w = Math.round(G.wipe * 160); if (i % 2) R(160 - w, i * 16, w, 16, 3); else R(0, i * 16, w, 16, 3); }
  if (G.flash) { ctx.globalAlpha = 0.85; R(0, 0, 160, 144, 3); ctx.globalAlpha = 1; }
  if (G.fade > 0) { ctx.globalAlpha = [0, 0.4, 0.75, 1][Math.min(3, Math.floor(G.fade * 3.999))]; R(0, 0, 160, 144, 0); ctx.globalAlpha = 1; }
}
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  update(dt); render(); pressed.clear();
  requestAnimationFrame(loop);
}
function boot() { run(titleScreen); requestAnimationFrame(loop); }
let booted = false;
const go = () => { if (!booted) { booted = true; boot(); } };
if (document.fonts && document.fonts.load) { document.fonts.load("8px 'Press Start 2P'").then(go, go); setTimeout(go, 1500); } else go();
</script>
